version: 2

models:
  - name: int_order_lines
    description: Línea de pedido enriquecida con datos de cabecera e ingresos calculados con la macro net_revenue.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_key, line_number]
    columns:
      - name: net_revenue
        tests: [not_null]
  - name: int_customer_geo
    description: Cliente con su nación y región.
    columns:
      - name: customer_key
        tests: [unique, not_null]
  - name: int_supplier_geo
    description: Proveedor con su nación y región.
    columns:
      - name: supplier_key
        tests: [unique, not_null]

# ------------------------------------------------------------------
# TESTS UNITARIOS (dbt >= 1.8): validan la LÓGICA con datos simulados
# ------------------------------------------------------------------
unit_tests:
  - name: ut_int_order_lines_calcula_ingreso_neto
    description: Comprueba que la macro net_revenue calcula bien el ingreso con y sin impuestos.
    model: int_order_lines
    given:
      - input: ref('stg_lineitem')
        rows:
          - {order_key: 1, line_number: 1, part_key: 10, supplier_key: 20, quantity: 5, extended_price: 1000.00, discount: 0.10, tax: 0.05}
          - {order_key: 1, line_number: 2, part_key: 11, supplier_key: 21, quantity: 2, extended_price: 200.50,  discount: 0.00, tax: 0.08}
      - input: ref('stg_orders')
        rows:
          - {order_key: 1, customer_key: 100, order_status: 'O', order_date: '1996-01-10'}
    expect:
      rows:
        - {order_key: 1, line_number: 1, customer_key: 100, net_revenue: 900.00, net_revenue_with_tax: 945.00}
        - {order_key: 1, line_number: 2, customer_key: 100, net_revenue: 200.50, net_revenue_with_tax: 216.54}

  - name: ut_int_order_lines_descarta_lineas_sin_pedido
    description: Una línea cuyo pedido no existe en stg_orders no debe llegar al modelo (inner join).
    model: int_order_lines
    given:
      - input: ref('stg_lineitem')
        rows:
          - {order_key: 1, line_number: 1, part_key: 10, supplier_key: 20, quantity: 1, extended_price: 100.00, discount: 0.00, tax: 0.00}
          - {order_key: 999, line_number: 1, part_key: 10, supplier_key: 20, quantity: 1, extended_price: 50.00, discount: 0.00, tax: 0.00}
      - input: ref('stg_orders')
        rows:
          - {order_key: 1, customer_key: 100, order_status: 'F', order_date: '1995-05-05'}
    expect:
      rows:
        - {order_key: 1, line_number: 1, net_revenue: 100.00}
